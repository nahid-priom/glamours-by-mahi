<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F6F2" />
    <title>Offline — Shakira Enterprise</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #F8F6F2;
        color: #111111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 24rem;
        text-align: center;
        background: #fff;
        border: 1px solid rgba(17,17,17,0.08);
        border-radius: 1.5rem;
        padding: 2rem;
        box-shadow: 0 4px 24px -8px rgba(17,17,17,0.08);
      }
      img { width: 4rem; height: 4rem; border-radius: 1rem; }
      h1 { font-family: Georgia, serif; font-size: 1.5rem; margin-top: 1rem; }
      p { color: #6B7280; font-size: 0.875rem; margin-top: 0.5rem; line-height: 1.5; }
      .actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      button, a {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 9999px;
        padding: 0.625rem 1.25rem;
        cursor: pointer;
        text-decoration: none;
      }
      button { background: #111111; color: #fff; border: none; }
      a { background: #fff; color: #111111; border: 1px solid rgba(17,17,17,0.1); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Shakira Enterprise" />
      <h1>You&apos;re currently offline</h1>
      <p>Check your connection and try again. Previously visited pages may still be available.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try Again</button>
        <a href="/">Return Home</a>
      </div>
    </div>
  </body>
</html>
